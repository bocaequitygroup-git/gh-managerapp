<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D24">
<title>GH Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2418; --ink2:#34503F; --page:#E6EDE8; --card:#FFFFFF; --line:#B4C5B9;
  --leaf:#0B6B3A; --leafd:#084D2A; --leaft:#D5EBDC;
  --amber:#8F4B00; --ambert:#FFE2A8; --red:#AE2218; --redt:#FBDCD8;
  --blue:#1A4C85; --bluet:#DAE7F6; --bar:#0B3D24;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 17px/1.4 var(--body);min-height:100vh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{background:var(--bar);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;position:sticky;top:0;z-index:20}
.top .line1{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font:700 28px/1 var(--disp);letter-spacing:.02em;flex:1}
.top .who{font-size:14px;opacity:.92}
.ibtn{min-width:48px;min-height:48px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:8px;font-weight:700;padding:0 12px}
.ibtn svg{width:24px;height:24px;vertical-align:middle}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#6FE29B;flex:none}
.dot.demo{background:#FFD27A}.dot.off{background:#FF8A80}
.banner{background:var(--ambert);color:#4A2700;border-bottom:3px solid var(--amber);padding:10px 14px;font-weight:700}
.banner.bad{background:var(--redt);color:#650F08;border-color:var(--red)}

/* layout */
main{max-width:720px;margin:0 auto;padding:12px 12px calc(150px + env(safe-area-inset-bottom,0px));outline:none}
h2.sec{font:700 24px/1.1 var(--disp);letter-spacing:.02em;margin:22px 2px 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font:400 15px var(--body);color:var(--ink2)}
h2.view{font:700 30px/1.05 var(--disp);margin:6px 2px 4px}
p.hint{margin:0 2px 12px;color:var(--ink2);font-size:16px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:8px;padding:16px;color:var(--ink2)}

/* rows */
.row{background:var(--card);border:2px solid var(--line);border-left:10px solid var(--leaf);border-radius:8px;padding:12px 14px;margin-bottom:10px;position:relative}
.row[data-go]{cursor:pointer}
.row.active{border-left-color:var(--leaf)}
.row.paused,.row.attn{border-left-color:#D98200}
.row.wait,.row.routine{border-left-color:var(--blue)}
.row.must,.row.crit{border-left-color:var(--red)}
.row.sev1{border-left-color:#7A8F80}.row.sev2{border-left-color:#D98200}.row.sev3{border-left-color:#C2410C}.row.sev4{border-left-color:var(--red)}
.rowtop{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bed{font:700 32px/1 var(--disp);letter-spacing:.01em}
.act{font-weight:700;font-size:18px;margin-top:4px}
.sub{color:var(--ink2);font-size:16px;margin-top:2px}
.facts{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:16px;flex-wrap:wrap}
.facts b{font-weight:700}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:700;font-size:14px;border:2px solid currentColor;white-space:nowrap}
.tag.active{color:var(--leaf)}.tag.paused{color:var(--amber);background:var(--ambert)}.tag.wait{color:var(--blue)}
.tag.must{color:var(--red)}.tag.ok{color:var(--leaf)}.tag.warn{color:var(--amber)}
.strip{margin-top:8px;padding:8px 10px;border-radius:6px;font-weight:700;font-size:15px}
.strip.pause{background:var(--ambert);color:#4A2700}
.strip.swap{background:var(--bluet);color:#0F2F55}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.chev{width:26px;height:26px;flex:none;color:var(--ink2)}
.qrow{display:flex;gap:12px;align-items:center}
.qrow .grow{flex:1;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.meter{height:10px;background:#D7E1DA;border-radius:5px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf)}

/* buttons, chips, forms */
.btn{min-height:52px;padding:0 18px;border:2px solid var(--ink);background:#fff;border-radius:8px;font-weight:700;font-size:17px}
.btn.primary{background:var(--leaf);border-color:var(--leafd);color:#fff}
.btn.danger{background:var(--red);border-color:#7E140D;color:#fff}
.btn.sm{min-height:46px;font-size:16px;padding:0 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{min-height:46px;padding:0 14px;border:2px solid var(--ink);background:#fff;border-radius:999px;font-weight:700;font-size:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:17px}
textarea{min-height:92px;resize:vertical}
.find{display:flex;gap:8px;margin:8px 0 4px}
.find input{flex:1}
.find .btn{flex:none}
.err{background:var(--redt);color:#650F08;border:2px solid var(--red);padding:10px 12px;border-radius:8px;font-weight:700;margin:14px 0 0}
.note{background:var(--ambert);color:#4A2700;border-radius:8px;padding:10px 12px;margin:12px 0;font-weight:700}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.check .tag{margin-left:auto}
.check.miss{border-color:var(--amber);background:#FFF6E0}
.check .t{font-weight:700}
.tick{margin:14px 0 0;display:flex;gap:10px;align-items:center;font-weight:700}
.tick input{width:28px;min-height:28px;flex:none}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--bar);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
nav.tabs button{border:0;background:transparent;min-height:64px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink2);position:relative}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{background:var(--leaft);color:var(--leafd);box-shadow:inset 0 4px 0 var(--leaf)}
.badge{position:absolute;top:3px;right:calc(50% - 24px);min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;line-height:22px;text-align:center;padding:0 5px}
.badge.soft{background:var(--blue)}
.fab{position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:25;min-height:56px;padding:0 20px;border-radius:28px;border:2px solid var(--leafd);background:var(--leaf);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--leafd)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(14,36,24,.6)}
#sheet .panel{position:relative;background:#fff;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;border-top:6px solid var(--leaf);animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
#sheet h2{margin:0;font:700 28px/1.05 var(--disp);flex:1}
#sheet .x{min-width:48px;min-height:48px;font-size:30px;border:2px solid var(--ink);background:#fff;border-radius:8px;line-height:1}
#sheet .body{padding:4px 16px 12px;overflow:auto;flex:1}
#sheet footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
#sheet footer .btn{flex:1 1 150px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:700}

/* toast, scan */
#toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:70;max-width:560px;margin:0 auto;background:var(--ink);color:#fff;padding:14px 16px;border-radius:10px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#toast.bad{background:var(--red)}
#scan{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .bar{padding:14px;background:#000;color:#fff;display:flex;gap:12px;align-items:center}
#scan .bar p{margin:0;flex:1;font-weight:700}

/* login */
.login{max-width:440px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px}
.login h1{font:700 52px/.95 var(--disp);margin:0 0 6px;color:var(--leafd)}
.login p{color:var(--ink2);margin:0 0 18px}
.login .btn{width:100%;margin-top:18px}
.login .demo{margin-top:20px}

@media (min-width:760px){ nav.tabs{max-width:720px;left:50%;right:auto;width:720px;transform:translateX(-50%);border-left:3px solid var(--bar);border-right:3px solid var(--bar)} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="scan" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="bar"><p id="scanMsg">Point the camera at the bed QR code.</p><button class="btn" id="scanStop" type="button">Cancel</button></div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<noscript>This app needs JavaScript.</noscript>

<script>
'use strict';
/* ====================================================================================
   GH Manager (GH-Managerapp.html): manager and founder console for the VPOS-GH greenhouse system.
   Talks to Code_GH.gs (the Apps Script web app that is bound to the VPOS-GH sheet).

   SETUP: deploy Code_GH.gs as a Web app (Execute as: Me, Who has access: Anyone),
   then paste the /exec URL between the quotes below.
   Set to the GH SCRIPT deployment (version 4). Leave it empty to run in demo mode with built-in sample data (PIN 1234).
   ==================================================================================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxI5EoHK-uRAthC9-V6X1xkXaNvGJYuBmOyI4ox7xeNiTw6rmRPA6mWbw01wKzTbtw5Aw/exec';
const REQUEST_TIMEOUT_MS = 20000;
const BOARD_REFRESH_MS = 30000;

const MANAGER_ROLES = ['manager', 'founder', 'owner'];
const DEMO = !WEB_APP_URL;

/* ---------- state (the session token lives only here, in memory) ---------- */
const S = {
  token: null, user: null, tab: 'board', loadedAt: 0, syncAt: 0, sync: null, netErr: '', online: navigator.onLine,
  boardFilter: 'all', lookup: '', scoutBed: '', scoutDomain: '', scoutSev: 0, logWorker: '', logBed: '', logView: 'done',
  showAllRoutine: false, showAllGrowing: false, reassigned: {}, reassignLog: [], sheet: null, refreshing: false, again: false,
  users: [], loginErr: ''
};
let D = emptyData();

/* ---------- small helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const nk = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
// Tolerant field reader: tries the exact keys, then any key that matches ignoring case, underscores and spaces.
function g(o, ...keys) {
  if (!o || typeof o !== 'object') return undefined;
  for (const k of keys) if (o[k] !== undefined && o[k] !== null) return o[k];
  const map = {};
  Object.keys(o).forEach(k => { map[nk(k)] = k; });
  for (const k of keys) { const real = map[nk(k)]; if (real !== undefined && o[real] !== undefined && o[real] !== null) return o[real]; }
  return undefined;
}
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const parseDay = s => /^\d{4}-\d{2}-\d{2}/.test(String(s || '')) ? new Date(String(s).slice(0, 10) + 'T00:00:00') : null;
const dayDiff = (a, b) => { const x = parseDay(a), y = parseDay(b); return x && y ? Math.round((x - y) / 86400000) : NaN; };
const fmtDay = s => { const d = parseDay(s); return d ? d.toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'}) : 'no date'; };
const fmtStamp = ts => { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) + ', ' + d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}); };
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) : '';
const fmtMins = m => m === '' || m == null || isNaN(m) ? '' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const yes = v => v === true || ['yes', 'true'].includes(String(v).toLowerCase());
const cropName = n => String(n || '').replace(/-GH$/, '');
function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.floor(m / 60) + ' h ago';
  return Math.floor(m / 1440) + ' d ago';
}
function dayHead(ts) {
  const d = ymd(new Date(ts)), t = today();
  if (d === t) return 'Today'; if (dayDiff(t, d) === 1) return 'Yesterday';
  return fmtDay(d);
}
const SEV = ['Low', 'Moderate', 'High', 'Critical'];
const sevLabel = n => SEV[Math.max(1, Math.min(4, Number(n) || 1)) - 1];

const ICON = {
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2 2 3-3M4 14l2 2 3-3"/><path d="M12 7h8M12 15h8"/></svg>',
  verify: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  ready: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c0-9 5-15 15-16 0 10-6 15-15 16z"/><path d="M5 20c2-5 5-8 9-10"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.5l3 3 6-7"/></svg>',
  scout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---------- data model ---------- */
function emptyData() { return {beds: [], bays: [], cohorts: [], proposals: [], pendingWork: [], gates: [], tasks: [], swaps: [], workers: [], done: {}, history: [], activities: [], bedMap: {}, actByName: {}, cohortsByBed: {}, at: 0}; }

function normLoad(r) {
  const d = emptyData();
  d.beds = (g(r, 'beds') || []).map(b => ({id: String(g(b, 'id', 'bedId', 'Bed_ID')), bay: String(g(b, 'bay', 'Bay_ID') || ''), len: g(b, 'len', 'Length_ft'), ok: g(b, 'ok') !== false}));
  d.bays = (g(r, 'bays') || []).map(b => Array.isArray(b) ? {id: String(b[0]), name: b[1]} : {id: String(g(b, 'id', 'Bay_ID')), name: g(b, 'name', 'Bay_Name')});
  d.cohorts = (g(r, 'cohorts') || []).map(c => ({id: String(g(c, 'id', 'Cohort_ID')), crop: cropName(g(c, 'crop', 'Crop_Name')), bed: String(g(c, 'bed', 'Bed_ID') || ''),
    stage: String(g(c, 'stage', 'Cohort_Status') || '').toUpperCase(), ver: yes(g(c, 'ver', 'Planting_Verified')), dl: g(c, 'dl') || 'Planting date',
    dob: g(c, 'dob') || '', hs: g(c, 'hs') || '', he: g(c, 'he') || '', pm: String(g(c, 'pm') || '').toUpperCase()}));
  d.proposals = (g(r, 'proposals') || []).map(p => ({id: String(g(p, 'id', 'Planned_Cohort_ID')), crop: cropName(g(p, 'crop', 'Crop_Name')), rec: g(p, 'rec', 'Recommended_Bed_ID') || '', date: g(p, 'date', 'Planned_DOB') || ''}));
  d.tasks = (g(r, 'tasks') || []).map(t => {
    const st = String(g(t, 'st', 'Status') || '').toUpperCase();
    return {sid: String(g(t, 'sid', 'Session_ID')), bed: String(g(t, 'bed', 'Bed_ID') || ''), act: g(t, 'act', 'Activity_Name') || '', w: String(g(t, 'w', 'Worker_ID') || ''),
      date: g(t, 'date', 'Assigned_Time') || '', st, mins: g(t, 'mins', 'Elapsed_Minutes') === undefined ? '' : g(t, 'mins', 'Elapsed_Minutes'), pr: g(t, 'pr') || '',
      rf: g(t, 'rf', 'reassignedFrom', 'Reassigned_From') || '', kind: st === 'PAUSED' ? 'paused' : ['ACTIVE', 'IN_PROGRESS', 'STARTED', 'RUNNING'].includes(st) ? 'active' : 'wait'};
  });
  d.workers = (g(r, 'workers') || []).map(w => ({id: String(g(w, 'id', 'Worker_ID')), name: g(w, 'name', 'Name') || g(w, 'id')}));
  d.swaps = (g(r, 'swaps') || []).map(x => ({sid: String(g(x, 'sid') || ''), bed: g(x, 'bed') || '', act: g(x, 'act') || '', from: String(g(x, 'from') || ''), to: String(g(x, 'to') || ''),
    by: g(x, 'by') || '', note: g(x, 'note') || '', at: g(x, 'at') || null})).sort((a, b) => (b.at || 0) - (a.at || 0));
  d.pendingWork = (g(r, 'pendingWork') || []).map(w => ({phase: g(w, 'phase') || '', id: String(g(w, 'id')), bed: String(g(w, 'bed') || ''), act: g(w, 'act') || '', worker: g(w, 'worker') || '', end: g(w, 'end') || null, min: g(w, 'min'), qty: g(w, 'qty') || '', cohort: g(w, 'cohort') || ''}));
  d.done = g(r, 'done') || {};
  d.gates = g(r, 'gates') || [];
  d.history = g(r, 'history') || [];
  d.activities = (g(r, 'activities') || []).map(a => ({id: g(a, 'id', 'Activity_ID'), name: g(a, 'name', 'Activity_Name'), group: g(a, 'group', 'Activity_Group') || 'Other', phase: g(a, 'phase', 'Activity_Phase') || '',
    pre: String(g(a, 'pre', 'Prerequisite_Activity_ID') || ''), req: yes(g(a, 'req', 'Required_For_Availability')), cnt: yes(g(a, 'cnt', 'Requires_Count')), unit: g(a, 'unit', 'Default_Unit') || ''}));
  d.beds.forEach(b => { d.bedMap[b.id] = b; });
  d.activities.forEach(a => { d.actByName[a.name] = a; });
  d.cohorts.forEach(c => { (d.cohortsByBed[c.bed] = d.cohortsByBed[c.bed] || []).push(c); });
  d.at = Date.now();
  return d;
}
function normSync(r) {
  return {
    log: (g(r, 'log') || []).map(l => ({bed: g(l, 'bedId', 'bed', 'Bed_ID') || '', act: g(l, 'act', 'Activity_Name') || '', worker: g(l, 'worker', 'Worker_ID') || '', end: g(l, 'end', 'End_Time') || null,
      min: g(l, 'min', 'Elapsed_Minutes'), qty: g(l, 'qty', 'Quantity') || '', flag: !!g(l, 'flag'), rf: g(l, 'rf', 'reassignedFrom', 'Reassigned_From') || '', id: String(g(l, 'id') || ''), ver: !!g(l, 'ver'), verBy: g(l, 'verBy') || ''})),
    scouts: (g(r, 'scouts') || []).map(s => ({id: String(g(s, 'id', 'Finding_ID')), workerId: g(s, 'workerId', 'Worker_ID') || '', bed: g(s, 'bedId', 'bed', 'Bed_ID') || '',
      domains: Array.isArray(g(s, 'domains', 'Domains')) ? g(s, 'domains', 'Domains') : String(g(s, 'domains', 'Domains') || '').split(';').filter(Boolean),
      sev: Number(g(s, 'sev', 'Severity')) || 1, note: g(s, 'note', 'Notes') || '', at: g(s, 'at', 'Logged_At') || null}))
  };
}

const wname = id => { const w = D.workers.find(x => x.id.toLowerCase() === String(id).toLowerCase()); return w ? w.name : (S.user && S.user.id === id ? S.user.name : (id || 'Unassigned')); };
const bayName = id => { const b = D.bays.find(x => x.id === id); return b ? b.name : id; };
const cohortsOn = bed => D.cohortsByBed[bed] || [];
const tasksOn = bed => D.tasks.filter(t => t.bed === bed);
const phaseOf = name => (D.actByName[name] || {}).phase || '';
const hasOpenPhase = (bed, phase) => tasksOn(bed).some(t => phaseOf(t.act) === phase);
const LIVE = ['PRE_PLANTING', 'GROWING', 'HARVEST_READY'];
function minsNow(t) { if (t.mins === '' || t.mins == null) return ''; return t.kind === 'active' ? Number(t.mins) + Math.max(0, Math.floor((Date.now() - D.at) / 60000)) : Number(t.mins); }

// The bed checklist is flat: every required post-harvest and pre-planting step must be done and verified, in any order.
// Plant material check: the transplant step applies to transplant crops, the seed step to direct-seeded crops (CROP_REFERENCE.Planting_Method, sent as cohort.pm).
const PMT = 'Plant Material (Transplant)', PMS = 'Plant Material (Direct Seed)';
const PM_ASK = {[PMT]: 'Is the plant ready to be transplanted?', [PMS]: 'Are the seeds ready for seeding?'};
const pmSkip = (a, c) => !!a && ((a.group === PMT && !(c && c.pm === 'TRANSPLANT')) || (a.group === PMS && !(c && c.pm === 'DIRECT_SEED')));
const gateCohort = bed => cohortsOn(bed).find(c => c.stage === 'PRE_PLANTING') || null;
const SEC = {1: 'Step 1: Bed base reset (post-harvest and clean-up)', 2: 'Step 2: Infrastructure prep (pre-planting)', 3: 'Step 3: Plant material check'};
const secOf = a => !a ? 2 : (a.group === PMT || a.group === PMS) ? 3 : (/^harvest$|post-?harvest/i.test(a.phase) || a.group === 'Bed Preparation') ? 1 : 2;
// Prep that must be done before a bed can be verified ready for planting (Pre-Planting activities marked required).
function prepNeeds(bed) {
  const done = D.done[bed] || [], c = gateCohort(bed);
  return D.activities.filter(a => a.req && /pre-?planting/i.test(a.phase) && !pmSkip(a, c)).sort((x, y) => secOf(x) - secOf(y) || String(x.id).localeCompare(String(y.id)))
    .map(a => ({key: a.id, label: a.name + (PM_ASK[a.group] ? ' - ' + PM_ASK[a.group] : ''), ok: done.includes(a.name), act: a.name}));
}
// Which harvest activity fits a bay, from the "(Bay 4)" or "(Bays 2 & 3)" in its name.
function harvestActFor(bed) {
  const bay = (String(bed).match(/^GH-(\d)/) || [])[1];
  const acts = D.activities.filter(a => /^harvest$/i.test(a.phase));
  return acts.find(a => { const m = String(a.name).match(/\(Bays? ([^)]*)\)/); return m && bay && m[1].includes(bay); }) || acts[0] || null;
}
// Turnover: a harvest recorded (when the crop was harvested), plus every required Post-Harvest activity.
function turnoverNeeds(bed) {
  const done = D.done[bed] || [], items = [];
  const harvested = cohortsOn(bed).some(c => c.stage === 'HARVEST_COMPLETE');
  const hActs = D.activities.filter(a => a.req && /^harvest$/i.test(a.phase));
  if (harvested && hActs.length) { const fit = harvestActFor(bed); items.push({key: 'harvest', label: 'Harvest recorded', ok: hActs.some(a => done.includes(a.name)), act: fit ? fit.name : hActs[0].name, noDispatch: true}); }
  D.activities.filter(a => a.req && /post-?harvest/i.test(a.phase)).forEach(a => items.push({key: a.id, label: a.name, ok: done.includes(a.name), act: a.name}));
  return items;
}
// Every required step a bed must clear, as a flat checklist (any order): the server's gate steps, minus the plant material step that does not fit the crop.
// status: OPEN, ASSIGNED, IN_PROGRESS, DONE (waiting for verification) or VERIFIED. gate is always true: only required steps are listed.
function turnoverSteps(bed) {
  const gate = (D.gates || []).find(x => x.bed === bed && (x.kind === 'turnover' || !x.cohort));
  const log = S.sync ? S.sync.log : [], c = gateCohort(bed);
  const base = gate ? gate.steps.map(s => ({label: s.act, status: String(s.status || 'OPEN').toUpperCase(), gate: true}))
    : turnoverNeeds(bed).map(n => ({label: n.label, status: !n.ok ? 'OPEN' : (log.some(l => l.bed === bed && l.act === n.act && l.ver) ? 'VERIFIED' : 'DONE'), gate: true}));
  return base.filter(st => !pmSkip(D.actByName[st.label], c)).map(st => Object.assign(st, {wait: null}))
    .sort((x, y) => secOf(D.actByName[x.label]) - secOf(D.actByName[y.label]) || String(x.label).localeCompare(String(y.label)));
}
const gateSteps = bed => turnoverSteps(bed).filter(x => x.gate);
// Beds with no crop waiting that are being reset: every required step must be verified before they are ready for the next planting.
const resetBeds = () => (D.gates || []).filter(x => x.kind === 'prep' && !x.cohort).map(x => x.bed);
// A finished log entry counts as verified when the log says so, or when the bed's gate shows that same step as verified.
function logVerified(l) {
  if (l.ver) return {by: l.verBy};
  for (const gt of (D.gates || [])) if (gt.bed === l.bed) for (const st of gt.steps) {
    if (String(st.status).toUpperCase() === 'VERIFIED' && st.act === l.act && (st.logId && l.id ? st.logId === l.id : Math.abs(Number(st.end) - Number(l.end)) < 60000)) return {by: st.by};
  }
  return null;
}
const turnoverBeds = () => [...new Set(D.cohorts.filter(c => c.stage === 'HARVEST_COMPLETE' || c.stage === 'TERMINATED').map(c => c.bed))].sort();
const openBeds = () => D.beds.filter(b => b.ok && !cohortsOn(b.id).length);

function windowText(c) {
  const t = today();

  if (d > 0) return 'Harvest window opens in ' + plural(d, 'day') + ', ' + fmtDay(c.hs);
  if (c.he && dayDiff(c.he, t) < 0) return 'Past the latest harvest date, ' + fmtDay(c.he);
  return 'Harvest window open since ' + fmtDay(c.hs) + (c.he ? ', closes ' + fmtDay(c.he) : '');
}

/* ---------- API (live Apps Script, or the built-in demo backend) ---------- */
async function api(action, payload) {
  const body = Object.assign({action, token: S.token}, payload || {});
  if (DEMO) return mockApi(action, body);
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(WEB_APP_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), signal: ctrl.signal, redirect: 'follow'});
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The server took longer than ' + Math.round(REQUEST_TIMEOUT_MS / 1000) + ' seconds to answer. Try again.');
    throw new Error('Could not reach the server. Check your signal and try again.');
  } finally { clearTimeout(timer); }
  let data;
  try { data = JSON.parse(await res.text()); } catch (e) { throw new Error('The server sent an unexpected reply. Check that the web app is deployed with access set to Anyone.'); }
  if (!data || data.ok === false) {
    const msg = String(g(data, 'error') || 'The request failed.');
    if (/session expired/i.test(msg) && S.token) expire();
    throw new Error(msg);
  }
  return data;
}
function expire() { S.token = null; S.user = null; S.loginErr = 'Your session ended. Sign in again.'; closeSheet(); render(); }

/* ---------- refresh ---------- */
const needSync = () => ['today', 'verify', 'scout', 'log'].includes(S.tab);
async function refresh(opts) {
  if (!S.token) return;
  if (S.refreshing) { S.again = true; return; }
  S.refreshing = true; spin(true);
  try {
    D = normLoad(await api('load')); S.loadedAt = Date.now(); S.netErr = '';
    if (needSync() || (opts && opts.sync)) { S.sync = normSync(await api('wSync')); S.syncAt = Date.now(); }
  } catch (e) { if (!S.token) { S.refreshing = false; return; } S.netErr = e.message; }
  S.refreshing = false; spin(false);
  render();
  if (S.again) { S.again = false; refresh(); }
}

/* ---------- queue for the Today view ---------- */
function buildQueue() {
  const t = today(), out = [];
  const add = (pri, go, arg, bed, title, detail, sort) => out.push({pri, go, arg, bed: bed || '', title, detail, sort: sort || '9999'});
  D.proposals.forEach(p => add('must', 'proposal', p.id, p.rec, 'Approve a bed for ' + p.crop, 'Planned ' + fmtDay(p.date) + (p.rec ? ', suggested ' + p.rec : ''), p.date));
  D.cohorts.forEach(c => {
    if (c.stage === 'PRE_PLANTING') {
      const due = c.dob && dayDiff(c.dob, t) <= 0, soon = c.dob && dayDiff(c.dob, t) <= 3;
      if (!c.ver) add(soon ? 'must' : 'routine', 'verifyBed', c.id, c.bed, 'Verify the bed is ready for ' + c.crop, (due ? 'Planting was due ' : 'Planting planned ') + fmtDay(c.dob), c.dob);
      else if (due) add('must', 'plant', c.id, c.bed, 'Record planting of ' + c.crop, 'Bed verified, planting is due', c.dob);
      else add('routine', 'plant', c.id, c.bed, 'Verified, waiting to plant: ' + c.crop, 'Planned ' + fmtDay(c.dob), c.dob);
    } else if (c.stage === 'GROWING') {
      const d = dayDiff(c.hs, t);
      if (c.hs && d <= 0) add('must', 'verifyReady', c.id, c.bed, 'Check harvest maturity of ' + c.crop, windowText(c), c.hs);
      else if (c.hs && d <= 3) add('attn', 'verifyReady', c.id, c.bed, c.crop + ' harvest window opens soon', windowText(c), c.hs);
      else add('routine', 'verifyReady', c.id, c.bed, 'Growing: ' + c.crop, windowText(c), c.hs || '9999');
    } else if (c.stage === 'HARVEST_READY') {
      const crew = hasOpenPhase(c.bed, 'Harvest');
      add(crew ? 'routine' : 'must', 'bed', c.bed, c.bed, crew ? c.crop + ' harvest in progress' : 'Assign a harvest crew for ' + c.crop,
        crew ? 'Mark the harvest complete when the totes are in' : 'Maturity verified, nobody assigned yet', '0');
    }
  });
  turnoverBeds().forEach(bed => {
    const needs = turnoverNeeds(bed), left = needs.filter(n => !n.ok).length;
    if (!left) add('must', 'turnover', bed, bed, 'Verify turnover and release the bed', 'Every required step is done', '0');
    else add('attn', 'turnover', bed, bed, 'Finish turnover steps', plural(left, 'step') + ' left before the bed can be released', '1');
  });
  D.tasks.forEach(tk => {
    const who = wname(tk.w);
    if (tk.kind === 'paused') add('attn', 'task', tk.sid, tk.bed, 'Paused: ' + tk.act, who + (tk.pr ? ': ' + tk.pr : ''), '0');
    else if (tk.kind === 'wait') {
      const late = tk.date && dayDiff(tk.date, t) < 0;
      add(late ? 'attn' : 'routine', 'task', tk.sid, tk.bed, tk.act + ', not started', who + ', assigned ' + fmtDay(tk.date), tk.date);
    }
  });
  D.beds.filter(b => !b.ok).forEach(b => add('attn', 'bed', b.id, b.id, 'Bed is not verified for use', 'Workers cannot start tasks here until a manager verifies it', '2'));
  if (S.sync) S.sync.scouts.filter(s => s.sev >= 3 && s.at && Date.now() - s.at < 3 * 86400000).forEach(s =>
    add('attn', 'scout', s.id, s.bed, sevLabel(s.sev) + ' scouting finding', (s.domains.join(', ') || 'No category') + (s.note ? ': ' + s.note : ''), '1'));
  const rank = {must: 0, attn: 1, routine: 2};
  return out.sort((a, b) => rank[a.pri] - rank[b.pri] || String(a.sort).localeCompare(String(b.sort)) || a.bed.localeCompare(b.bed));
}

/* Verify: everything a manager has to sign off, in one place */
function verifyData() {
  const t = today();
  const plant = D.cohorts.filter(c => c.stage === 'PRE_PLANTING' && c.bed && !c.ver).sort((a, b) => String(a.dob || '9999').localeCompare(String(b.dob || '9999')));
  const maturity = D.cohorts.filter(c => c.stage === 'GROWING' && c.hs && dayDiff(c.hs, t) <= 0).sort((a, b) => String(a.hs).localeCompare(String(b.hs)));
  const harvest = D.cohorts.filter(c => c.stage === 'HARVEST_READY').sort((a, b) => a.bed.localeCompare(b.bed));
  const turn = turnoverBeds(), releaseReady = turn.filter(bed => gateSteps(bed).every(x => x.status === 'VERIFIED'));
  const resetDone = b => gateSteps(b).every(x => x.status === 'VERIFIED');
  const release = [...new Set(turn.concat(resetBeds().filter(b => !resetDone(b))))].sort();   // beds still working through their gate steps
  const readyBeds = [...new Set(resetBeds().filter(resetDone))].sort();                          // empty beds cleared for planting
  // Finished by workers, not yet verified: the gate steps the server lists, plus any other finished task nobody has verified yet (last 7 days).
  const gateIds = new Set(D.pendingWork.map(w => w.id));
  const extra = S.sync ? S.sync.log.filter(l => l.id && l.end && l.worker && Date.now() - Number(l.end) < 7 * 864e5 && !gateIds.has(l.id) && !logVerified(l))
    .map(l => ({phase: '', id: l.id, bed: l.bed, act: l.act, worker: l.worker, end: l.end, min: l.min, qty: l.qty, cohort: '', extra: true})) : [];
  const work = D.pendingWork.concat(extra).sort((x, y) => (y.end || 0) - (x.end || 0));
  const recent = S.sync ? S.sync.log.filter(l => l.end && Date.now() - Number(l.end) < 48 * 36e5).sort((a, b) => (b.end || 0) - (a.end || 0)) : [];
  return {work, plant, maturity, harvest, release, releaseReady, readyBeds, recent};
}
function verifyCount() {
  const v = verifyData();
  return v.plant.length + v.maturity.length + v.harvest.length + v.releaseReady.length + v.work.length;
}
function viewVerify() {
  const v = verifyData();
  const plantRows = v.plant.map(c => {
    const needs = prepNeeds(c.bed), ok = needs.filter(n => n.ok).length, miss = needs.length - ok;
    return '<article class="row ' + (miss ? 'attn' : 'active') + '" data-go="verifyBed" data-arg="' + esc(c.id) + '"><div class="qrow"><div class="grow"><div class="rowtop"><span class="bed">' + esc(c.bed) + '</span><span class="tag ' + (miss ? 'warn' : 'ok') + '">' + (miss ? plural(miss, 'prep step') + ' missing' : 'Prep done') + '</span></div>' +
      '<div class="act">Verify the bed is ready for ' + esc(c.crop) + '</div><div class="sub">' + (needs.length ? ok + ' of ' + needs.length + ' required prep steps done. ' : '') + 'Planting planned ' + esc(fmtDay(c.dob)) + '. Planting is blocked until you verify.</div></div>' + ICON.chev + '</div></article>';
  }).join('');
  const workRows = v.work.map(w => {
    const open = cohortsOn(w.bed).some(c => c.stage === 'PRE_PLANTING' && !c.ver);
    return '<article class="row attn" data-go="verifyWork" data-arg="' + esc(w.id) + '"><div class="qrow"><div class="grow"><div class="rowtop"><span class="bed">' + esc(w.bed) + '</span><span class="tag warn">Needs verification</span></div>' +
      '<div class="act">' + esc(w.act) + '</div><div class="sub">Done by ' + esc(w.worker) + (w.end ? ', ' + esc(fmtStamp(w.end)) : '') + (w.min !== '' && w.min != null ? ', ' + esc(fmtMins(Number(w.min))) : '') + (w.qty ? ', ' + esc(w.qty) : '') + '</div>' +
      '<div class="sub">' + (w.extra ? 'Check this task was done properly.' : /post/i.test(w.phase) ? 'Check this clean-up step was done properly before releasing the bed.' : 'Check the bed is empty, cleared and checked.' + (open ? ' A crop is waiting to be planted here.' : '')) + '</div></div>' + ICON.chev + '</div></article>';
  }).join('');

    const cs = cohortsOn(bed).filter(c => c.stage === 'HARVEST_COMPLETE' || c.stage === 'TERMINATED');

    let lastSec = 0;
    const stepRows = steps.map(x => { const a = D.actByName[x.label], sc = secOf(a), head = sc !== lastSec ? '<div class="sub" style="margin-top:8px"><b>' + esc(SEC[sc]) + '</b></div>' : ''; lastSec = sc; const t = STEP_TAG[x.status] || NOT_DONE; return head + '<div class="rowtop" style="margin-top:6px"><span class="sub">' + esc(x.label) + (a && PM_ASK[a.group] ? ' - ' + esc(PM_ASK[a.group]) : '') + '</span><span class="tag ' + t[0] + '">' + t[1] + '</span></div>'; }).join('');
    return '<article class="row ' + (ready ? 'active' : 'attn') + '" data-go="' + (cs.length ? 'turnover' : 'bed') + '" data-arg="' + esc(bed) + '"><div class="qrow"><div class="grow"><div class="rowtop"><span class="bed">' + esc(bed) + '</span><span class="tag ' + (ready ? 'ok' : 'warn') + '">' + (ready ? (cs.length ? 'Ready to release' : 'Bed ready') : vok + ' of ' + req.length + ' required verified') + '</span></div>' +
      '<div class="act">' + (cs.length ? 'Verify turnover for ' + esc(cs.map(c => c.crop).join(', ')) : 'Required steps before the next planting') + '</div>' + stepRows +
      '<div class="sub" style="margin-top:6px">' + (ready ? (cs.length ? 'Every required step is verified. Verifying frees the bed for the next planting.' : 'Every required step is verified. The bed is ready for its next planting.') : 'The bed is ready once every step above is verified, in any order.') + '</div></div>' + ICON.chev + '</div></article>';
  }).join('');
  const readyRows = v.readyBeds.map(bed => {
    const steps = gateSteps(bed);

  const pend = {}; v.work.forEach(w => { pend[w.bed + '|' + w.act + '|' + w.end] = w.id; });
  const recentRows = v.recent.slice(0, 15).map(l => {
    const pid = pend[l.bed + '|' + l.act + '|' + l.end];

      '<div class="act">' + esc(l.act) + '</div><div class="sub">' + esc(wname(l.worker)) + ', ' + esc(dayHead(l.end) + ' ' + fmtTime(l.end)) + (l.min !== '' && l.min != null ? ', ' + esc(fmtMins(Number(l.min))) : '') + (l.qty ? ', ' + esc(l.qty) : '') + ((logVerified(l) || {}).by ? ', verified by ' + esc(logVerified(l).by) : '') + '</div></div>' + ICON.chev + '</div></article>';

  return '<h2 class="view">Verify</h2><p class="hint">Everything a manager has to sign off, in one place: work workers have finished, beds before planting, crops before harvest, finished harvests and beds ready to release.</p>' +
    section('Completed work to verify', v.work.length, workRows, 'No finished work is waiting for your verification.') +
    section('Verify bed ready for planting', v.plant.length + v.readyBeds.length, plantRows + readyRows, 'No bed is waiting to be verified for planting.') +
    section('Verify crop is ready to harvest', v.maturity.length, v.maturity.map(cohortCard).join(''), 'No growing crop has reached its harvest window.') +
    section('Mark harvest finished', v.harvest.length, v.harvest.map(cohortCard).join(''), 'No crop is waiting to be marked harvested.') +
    section('Verify turnover and release bed', v.release.length, releaseRows, 'No bed is waiting for turnover.') +
    section('Work completed in the last 48 hours', S.sync ? v.recent.length : '', S.sync ? recentRows : '<div class="empty">Loading completed work.</div>', 'No work was completed in the last 48 hours.');
}

/* Harvest ready */
function cohortCard(c) {

  let btns = '';

  else btns = '<button class="btn sm' + (open ? ' primary' : '') + '" data-go="verifyReady" data-arg="' + esc(c.id) + '">Verify harvest ready</button>';
  return '<article class="row ' + (c.stage === 'HARVEST_READY' ? 'active' : open ? 'attn' : 'routine') + '" data-go="bed" data-arg="' + esc(c.bed) + '"><div class="rowtop"><span class="bed">' + esc(c.bed) + '</span><span class="tag ' + (c.stage === 'HARVEST_READY' ? 'ok' : open ? 'warn' : 'wait') + '">' + STAGE_TEXT[c.stage] + '</span></div>' +

}
function lookupHtml() {
  return '<form class="find" id="findForm"><input id="lookup" list="bedlist" placeholder="Bed ID, for example GH-4-G02" value="' + esc(S.lookup) + '" autocapitalize="characters" autocomplete="off" aria-label="Bed ID">' +
    '<datalist id="bedlist">' + D.beds.map(b => '<option value="' + esc(b.id) + '">').join('') + '</datalist><button class="btn primary" type="submit">Find bed</button><button class="btn" type="button" data-act="scan">Scan QR</button></form>';
}
function viewReady() {
  const t = today(), byHs = (a, b) => String(a.hs || '9999').localeCompare(String(b.hs || '9999'));
  const ready = D.cohorts.filter(c => c.stage === 'HARVEST_READY').sort((a, b) => a.bed.localeCompare(b.bed));

    section('Growing', soon.length, soonShown.map(cohortCard).join('') + (soon.length > 6 ? '<button class="btn" data-toggle="growing" style="width:100%">' + (S.showAllGrowing ? 'Show fewer' : 'Show all ' + soon.length) + '</button>' : ''), 'No other crops are growing.');

/* Harvest complete */
function viewDone() {

    const needs = turnoverNeeds(bed), ok = needs.filter(n => n.ok).length, cs = cohortsOn(bed).filter(c => c.stage === 'HARVEST_COMPLETE' || c.stage === 'TERMINATED');

      '<div class="act">' + esc(cs.map(c => c.crop).join(', ')) + '</div><div class="sub">' + esc(cs.map(c => STAGE_TEXT[c.stage]).join(', ')) + ', ' + ok + ' of ' + needs.length + ' steps done</div>' +

/* ---------- login / logout ---------- */
async function onLogin(e) {
  e.preventDefault();
  const id = $('#lid').value.trim(), pin = $('#lpin').value.trim(), btn = $('#lgo'), err = $('#lerr');
  btn.disabled = true; btn.textContent = 'Signing in'; err.hidden = true;
  try {
    const r = await api('login', {user: id, pin});
    const u = r.user || {};
    if (!MANAGER_ROLES.includes(String(g(u, 'role') || '').toLowerCase())) throw new Error('This account is not a manager or founder. Use the worker app instead.');
    S.token = r.token; S.user = {id: g(u, 'id'), name: g(u, 'name') || id, role: g(u, 'role')}; S.loginErr = ''; S.tab = 'board';
    D = emptyData(); S.sync = null; S.loadedAt = 0; S.netErr = '';
    render(); refresh();
  } catch (ex) {
    err.textContent = ex.message; err.hidden = false; btn.disabled = false; btn.textContent = 'Sign in';
    $('#lpin').value = '';
  }
}
async function logout() {
  const tk = S.token; try { if (tk && !DEMO) await api('wLogout', {token: tk}); } catch (e) {}
  S.token = null; S.user = null; S.sync = null; S.reassignLog = []; S.reassigned = {}; D = emptyData(); S.loginErr = ''; closeSheet(); render();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200); }

/* ---------- bottom sheets ---------- */
function openSheet(title, body, foot, handlers, onMount) {
  S.sheet = {handlers: handlers || {}};
  const el = $('#sheet');
  el.innerHTML = '<div class="scrim" data-close></div><section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><h2 id="sheetTitle">' + esc(title) + '</h2><button class="x" data-close aria-label="Close">&times;</button></header>' +
    '<div class="body">' + body + '<p class="err" id="sheetErr" role="alert" hidden></p></div><footer>' + foot + '</footer></section>';
  el.hidden = false; document.body.classList.add('lock');
  if (onMount) onMount();
  const first = el.querySelector('.body input:not([type=checkbox]),.body select,.body textarea'); if (first) first.focus(); else el.querySelector('.x').focus();
}
function closeSheet() { const el = $('#sheet'); el.hidden = true; el.innerHTML = ''; S.sheet = null; document.body.classList.remove('lock'); }
async function runDo(btn) {
  const h = S.sheet && S.sheet.handlers[btn.dataset.do]; if (!h) return;
  const err = $('#sheetErr'), label = btn.textContent;
  err.hidden = true; btn.disabled = true; btn.textContent = 'Saving';
  try {
    const res = (await h(btn)) || {};
    if (res.keep) { btn.disabled = false; btn.textContent = label; return; }
    closeSheet(); if (res.toast) toast(res.toast);
    await refresh({sync: true}); if (res.open) go(res.open[0], res.open[1]);
  } catch (e) {
    if (!S.sheet) return;
    err.textContent = e.message; err.hidden = false; btn.disabled = false; btn.textContent = label; err.scrollIntoView({block: 'nearest'});
  }
}
const val = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
const need = (v, msg) => { if (!v) throw new Error(msg); return v; };
const bedOptions = (sel) => { const by = {}; D.beds.filter(b => b.ok).forEach(b => { (by[b.bay] = by[b.bay] || []).push(b); });
  return Object.keys(by).sort().map(bay => '<optgroup label="' + esc(bayName(bay)) + '">' + by[bay].map(b => { const c = cohortsOn(b.id).find(x => LIVE.includes(x.stage)); return '<option value="' + esc(b.id) + '"' + (b.id === sel ? ' selected' : '') + '>' + esc(b.id) + (c ? ' (' + esc(c.crop) + ')' : ' (open)') + '</option>'; }).join('') + '</optgroup>').join(''); };
const workerOptions = (sel, skip) => D.workers.filter(w => w.id.toLowerCase() !== String(skip || '').toLowerCase()).map(w => '<option value="' + esc(w.id) + '"' + (w.id === sel ? ' selected' : '') + '>' + esc(w.name) + '</option>').join('');
const kv = rows => '<dl class="kv">' + rows.filter(Boolean).map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>';
const checklist = items => items.map(i => '<div class="check' + (i.ok ? '' : ' miss') + '"><span class="t">' + esc(i.label) + '</span><span class="tag ' + (i.ok ? 'ok' : 'warn') + '">' + (i.ok ? 'Done' : 'Not done') + '</span></div>').join('');
const cancelBtn = '<button class="btn" data-close>Cancel</button>';
const gone = what => { toast(what + ' is no longer open. The list was refreshed.', true); refresh(); };

const SHEETS = {
  proposal(id) {
    const p = D.proposals.find(x => x.id === id); if (!p) return gone('That proposal');
    openSheet('Approve a bed', kv([['Crop', p.crop], ['Planned', fmtDay(p.date)], ['Suggested bed', p.rec || 'None']]) +
      '<label for="pBed">Bed to use</label><select id="pBed">' + bedOptions(p.rec) + '</select><label for="pWhy">Reason, only if rejecting</label><textarea id="pWhy"></textarea>',
      cancelBtn + '<button class="btn danger" data-do="reject">Reject</button><button class="btn primary" data-do="approve">Approve bed</button>', {
        approve: async () => { const bed = need(val('pBed'), 'Choose a bed.'); await api('approveAssignment', {cohort: p.id, bed}); return {toast: 'Approved ' + bed + ' for ' + p.crop}; },
        reject: async () => { const reason = need(val('pWhy'), 'Write a reason for rejecting.'); await api('rejectAssignment', {cohort: p.id, reason}); return {toast: 'Rejected the proposal for ' + p.crop}; }
      });
  },
  verifyWork(id) {
    // Search the same combined list the Verify tab shows: the server's gate steps PLUS other finished tasks nobody has verified yet.

function go(name, arg) { if (SHEETS[name]) SHEETS[name](arg); }

/* ---------- bed lookup and QR scan ---------- */
function resolveBed(text) {
  const raw = String(text || '').trim().toUpperCase(); if (!raw) return null;
  const ids = D.beds.map(b => b.id).sort((a, b) => b.length - a.length);
  const exact = ids.find(id => id.toUpperCase() === raw); if (exact) return exact;
  const inside = ids.find(id => raw.includes(id.toUpperCase())); if (inside) return inside;
  const compact = raw.replace(/[^A-Z0-9]/g, '');
  return ids.find(id => id.toUpperCase().replace(/[^A-Z0-9]/g, '') === compact) || null;
}
let scanStream = null, scanning = false;
async function startScan() {
  if (!('BarcodeDetector' in window)) return toast('This browser cannot scan QR codes. Type the bed ID instead.', true);
  let det; try { det = new BarcodeDetector({formats: ['qr_code']}); } catch (e) { return toast('This browser cannot scan QR codes. Type the bed ID instead.', true); }
  try { scanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false}); }
  catch (e) { return toast('Camera access was blocked. Allow the camera for this page, or type the bed ID.', true); }
  const v = $('#scanVideo'); v.srcObject = scanStream; $('#scan').hidden = false; $('#scanMsg').textContent = 'Point the camera at the bed QR code.';
  try { await v.play(); } catch (e) {}
  scanning = true;
  const loop = async () => {
    if (!scanning) return;
    try {
      const codes = await det.detect(v);
      if (codes.length) {
        const bed = resolveBed(codes[0].rawValue);
        if (bed) { stopScan(); S.lookup = bed; go('bed', bed); return; }
        $('#scanMsg').textContent = 'That code is not a bed in this greenhouse. Try another.';
      }
    } catch (e) {}
    setTimeout(loop, 250);
  };
  loop();
}
function stopScan() { scanning = false; if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; $('#scan').hidden = true; }
$('#scanStop').addEventListener('click', stopScan);

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const close = t.closest('[data-close]'); if (close) { closeSheet(); return; }
  const doBtn = t.closest('[data-do]'); if (doBtn && S.sheet) { runDo(doBtn); return; }
  const goEl = t.closest('[data-go]'); if (goEl) { go(goEl.dataset.go, goEl.dataset.arg); return; }
  const tab = t.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); if (needSync() && Date.now() - S.syncAt > 20000) refresh({sync: true}); return; }
  const f = t.closest('[data-filter]'); if (f) { S.boardFilter = f.dataset.filter; render(); return; }
  const sd = t.closest('[data-scoutdom]'); if (sd) { S.scoutDomain = sd.dataset.scoutdom; render(); return; }
  const ss = t.closest('[data-scoutsev]'); if (ss) { S.scoutSev = Number(ss.dataset.scoutsev); render(); return; }
  const lv = t.closest('[data-logview]'); if (lv) { S.logView = lv.dataset.logview; render(); return; }

  const act = t.closest('[data-act]');
  if (act) { const a = act.dataset.act; if (a === 'refresh') refresh({sync: true}); else if (a === 'logout') logout(); else if (a === 'scan') startScan(); }
});

function mockCoh(id) { const c = MOCK.cohorts.find(x => x.id === id); if (!c) throw new Error('COHORT_PRODUCTION: ' + id + ' not found'); return c; }
function mockLog(bed, act, worker, qty) { MOCK.log.push({id: 'LOG-' + (MOCK.log.length + 1000), ver: false, bedId: bed, act, worker, end: Date.now(), min: 20, qty, flag: false}); MOCK.done[bed] = (MOCK.done[bed] || []).concat([act]); }
async function mockApi(action, p) {
  await sleep(220);
  if (!MOCK) mockInit();
  const M = MOCK, t = today(), copy = o => JSON.parse(JSON.stringify(o));
  if (!M.seeded) { M.seeded = true; M.log.unshift({id: 'LOG-900', ver: false, bedId: 'GH-1-R01', act: 'Pre-Plant Flush & Sanitization', worker: 'Jessica Luka', end: Date.now() - 36e5, min: 19, qty: '1 bed', flag: false}); }
  const MAP = {PLANNED: 'PRE_PLANTING', RESERVED: 'PRE_PLANTING', PRE_PLANTING: 'PRE_PLANTING', GROWING: 'GROWING', HARVEST_READY: 'HARVEST_READY', HARVEST_COMPLETE: 'HARVEST_COMPLETE', TERMINATED: 'TERMINATED'};
  const nameOf = id => (M.workers.find(w => w.id === id) || {}).name || id;
  if (action === 'users') return {users: [{id: 'usr-manager1', name: 'Chris Kenny', role: 'Manager'}, {id: 'usr-founder1', name: 'Kisanga', role: 'Founder'}]};
  if (action === 'login') {
    const u = {'usr-manager1': ['Chris Kenny', 'Manager'], 'usr-founder1': ['Kisanga', 'Founder']}[String(p.user).toLowerCase()];
    if (!u || String(p.pin) !== '1234') throw new Error('Wrong PIN, or this user cannot log in');
    return {token: 'demo-token', user: {id: String(p.user).toLowerCase(), name: u[0], role: u[1]}};
  }
  if (!p.token) throw new Error('Session expired');
  if (action === 'wLogout') return {};
  if (action === 'load') {
    const tasks = M.tasks.map(k => ({sid: k.sid, bed: k.bed, act: k.act, w: k.w, date: k.date, st: k.st, mins: k.startAt ? (k.st === 'PAUSED' ? k.frozen : Math.floor((Date.now() - k.startAt) / 60000)) : '', pr: k.st === 'PAUSED' ? k.pr : ''}));
    return copy({beds: M.beds, bays: M.bays.map(b => [b[0], b[1]]), activities: M.acts, workers: M.workers, done: M.done, history: [], pendingWork: M.log.filter(l => !l.ver && M.acts.some(a => a.name === l.act && a.req === 'Yes' && /pre-?planting|post-?harvest/i.test(a.phase))).map(l => ({phase: (M.acts.find(a => a.name === l.act) || {}).phase, id: l.id, bed: l.bedId, act: l.act, worker: l.worker, end: l.end, min: l.min, qty: l.qty})), tasks, swaps: M.swaps || [], proposals: M.proposals,
      cohorts: M.cohorts.filter(c => MAP[c.status] && c.bed).map(c => ({id: c.id, crop: c.crop, bed: c.bed, stage: MAP[c.status], ver: c.ver, dl: c.dl, dob: c.dob, hs: c.hs, he: c.he}))});
  }
  if (action === 'wSync') return copy({log: M.log, scouts: M.scouts, sessions: [], issues: []});
  const phase = name => (M.acts.find(a => a.name === name) || {}).phase;
  switch (action) {
    case 'approveAssignment': { const pr = M.proposals.find(x => x.id === p.cohort); if (!pr) throw new Error('BED_ASSIGNMENT: ' + p.cohort + ' not found');
      M.proposals = M.proposals.filter(x => x !== pr); M.cohorts.push({id: pr.id, crop: pr.crop, bed: p.bed, status: 'PLANNED', ver: false, dl: 'Seeding date', dob: pr.date, hs: '', he: ''}); return {}; }
    case 'rejectAssignment': M.proposals = M.proposals.filter(x => x.id !== p.cohort); return {};
    case 'verifyBedReady': { const c = mockCoh(p.cohort); if (!['PLANNED', 'RESERVED', 'PRE_PLANTING'].includes(c.status)) throw new Error('This cohort is not waiting to be planted'); c.ver = true; return {}; }
    case 'recordPlanting': { const c = mockCoh(p.cohort); if (!c.ver) throw new Error('A manager must verify the bed is ready before planting'); if (String(p.date) > t) throw new Error('Planting date cannot be in the future'); c.dob = p.date; c.status = 'GROWING'; c.hs = ymd(new Date(Date.now() + 21 * 86400000)); c.he = ymd(new Date(Date.now() + 35 * 86400000)); return {}; }
    case 'verifyReady': { const c = mockCoh(p.cohort); if (c.status !== 'GROWING') throw new Error('Only a growing cohort can be verified for harvest');
      if (c.hs && t < c.hs && !String(p.reason || '').trim()) throw new Error('Not yet at the earliest harvest date (' + c.hs + '). A written reason is required.'); c.status = 'HARVEST_READY'; return {}; }
    case 'completeHarvest': mockCoh(p.cohort).status = 'HARVEST_COMPLETE'; return {};
    case 'terminate': mockCoh(p.cohort).status = 'TERMINATED'; return {};
    case 'verifyWork': { const l = M.log.find(x => x.id === p.id); if (!l || l.ver) throw new Error('That work is already verified, or was not found'); l.ver = true; return {}; }
    case 'verifyTurnover': M.cohorts = M.cohorts.filter(c => !(c.bed === p.bed && ['HARVEST_COMPLETE', 'TERMINATED'].includes(c.status))); M.done[p.bed] = []; return {};
    case 'verifyBed': M.beds.find(b => b.id === p.bed).ok = true; return {};
    case 'dispatch': {
      const live = M.cohorts.find(c => c.bed === p.bed && ['GROWING', 'HARVEST_READY', 'PLANNED', 'RESERVED', 'PRE_PLANTING'].includes(c.status)), ph = phase(p.act), ls = live ? live.status : '';
      if (ph === 'Planting' && !(live && live.ver && ['PLANNED', 'RESERVED', 'PRE_PLANTING'].includes(ls))) throw new Error('Planting needs a cohort on this bed with the bed verified ready by a manager');
      if (ph === 'Harvest' && ls !== 'HARVEST_READY') throw new Error('Harvest needs the crop verified mature by a manager');
      const sid = 'SESS-' + String(++M.seq).padStart(6, '0'); M.tasks.push({sid, bed: p.bed, act: p.act, w: p.w, st: 'ASSIGNED', date: p.date || t, startAt: null, pr: ''}); return {sid}; }
    case 'override': if (!String(p.reason || '').trim()) throw new Error('A written reason is required'); mockLog(p.bed, p.act, S.user ? S.user.name : 'Manager', ''); M.log[M.log.length - 1].ver = true; return {};
    case 'closeTask': { const k = M.tasks.find(x => x.sid === p.sid); if (!k) throw new Error('FIELD_LIVE_SESSION: ' + p.sid + ' not found'); const a = M.acts.find(x => x.name === k.act);
      if (a && a.cnt === 'Yes' && (p.quantity === '' || p.quantity == null || isNaN(Number(p.quantity)))) throw new Error('Enter the quantity for this activity');
      M.tasks = M.tasks.filter(x => x !== k); mockLog(k.bed, k.act, nameOf(k.w), a && a.cnt === 'Yes' ? p.quantity + ' ' + a.unit : ''); return {}; }
    case 'reassignTask': { const k = M.tasks.find(x => x.sid === p.sid); if (!k) throw new Error('FIELD_LIVE_SESSION: ' + p.sid + ' not found'); if (!M.swaps) M.swaps = []; M.swaps.push({id: 'RA-' + (M.swaps.length + 1), sid: k.sid, bed: k.bed, act: k.act, from: k.w, to: p.to, by: nameOf(S.user.id), note: p.note || '', at: Date.now()}); k.w = p.to; return {}; }
  }
  throw new Error('Unknown action: ' + action);
}
